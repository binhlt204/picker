name: Build iOS IPA

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub bất cứ lúc nào
  push:
    branches:
      - binh
      - main
      - master
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-14 # macOS Apple Silicon M2 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Build iOS (No Codesign)
        run: |
          cd apps/mobile
          flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          cd apps/mobile
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q pickball-scanner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pickball-scanner-ios-ipa
          path: apps/mobile/build/ios/ipa/pickball-scanner.ipa
          retention-days: 7

