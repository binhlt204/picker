name: Build iOS IPA

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub bất cứ lúc nào
  push:
    branches:
      - binh
      - main
      - master
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-15 # Apple Silicon. Plugin camera_avfoundation can Xcode moi (SDK co AVCaptureSession.wasInterruptedNotification)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Build iOS (No Codesign)
        id: build
        run: |
          cd apps/mobile
          set -o pipefail
          xcodebuild -version | tee "$RUNNER_TEMP/build.log"
          flutter build ios --release --no-codesign 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      # Khi build lỗi: đưa các dòng lỗi + phần cuối log vào Annotations và Job Summary
      # để đọc nhanh trên giao diện/API mà không cần tải log đầy đủ.
      - name: Report iOS build errors
        if: failure() && steps.build.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import os, re
          tmp = os.environ["RUNNER_TEMP"]
          lines = open(os.path.join(tmp, "build.log"), errors="replace").read().splitlines()
          pat = re.compile(r"error|fail|not installed|requires|exception|unable|cannot|could not|xcode|deployment target", re.I)
          hits = [l for l in lines if pat.search(l)][:60]
          text = "=== DONG LOI/CANH BAO ===\n" + "\n".join(hits) + "\n\n=== 60 DONG CUOI ===\n" + "\n".join(lines[-60:])
          text = text[-30000:]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## iOS build failed\n```\n" + text + "\n```\n")
          enc = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=iOS build log::" + enc)
          PY

      - name: Package into IPA
        run: |
          cd apps/mobile
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q lbhouse-scanner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lbhouse-scanner-ios-ipa
          path: apps/mobile/build/ios/ipa/lbhouse-scanner.ipa
          retention-days: 7

